<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mascotas</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Fichas</p>
      <h1>Mascotas</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Vacunas</p><h1>Mascotas</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="pet-form" class="card form">
        <input id="name" placeholder="Nombre" maxlength="40" required />
        <input id="species" placeholder="Especie" maxlength="30" value="perro" />
        <button class="primary" type="submit">Agregar</button>
      </form>
      <form id="shot-form" class="card form">
        <select id="pet" required></select>
        <input id="vaccine" placeholder="Vacuna" maxlength="60" required />
        <input id="day" type="date" required />
        <input id="next" type="date" />
        <button class="primary" type="submit">Registrar</button>
      </form>
      <p id="form-error" class="error" hidden></p>
      <div id="list"></div>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
